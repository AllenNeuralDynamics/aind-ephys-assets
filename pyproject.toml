[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aind-ephys-assets"
description = "AIND ephys asset layout knowledge and helpers"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Allen Institute for Neural Dynamics" },
  { name = "Galen Lynch", email = "galen@galenlynch.com" },
]
classifiers = ["Programming Language :: Python :: 3"]
readme = "README.md"
version = "0.4.0"

dependencies = [
    "fsspec",
    "numpy>=1.24",
    "zarr>=2.16",
]

[project.optional-dependencies]
s3 = ["s3fs"]
si = [
    "scipy>=1.10",
    "spikeinterface>=0.104",
]

[project.urls]
Repository = "https://github.com/AllenNeuralDynamics/aind-ephys-assets/"
Issues = "https://github.com/AllenNeuralDynamics/aind-ephys-assets/issues"
Changelog = "https://github.com/AllenNeuralDynamics/aind-ephys-assets/blob/main/CHANGELOG.md"

[project.scripts]
# Add your CLI scripts here, e.g.:
# my_command = "aind_ephys_assets.scripts.my_command:main"

[dependency-groups]
types = ["mypy"]
dev = [{ include-group = "types" }, "codespell", "pytest", "pytest-cov", "ruff", "interrogate"]
jupyter = [{ include-group = "dev" }, "ipykernel", "pip"]
# SpikeInterface pins zarr<3 below Python 3.14; without this group the dev env would never test zarr 3.
zarr3 = ["zarr>=3"]

[tool.uv]
default-groups = ["dev", "zarr3"]
conflicts = [[{ extra = "si" }, { group = "zarr3" }]]

[tool.hatch.build.targets.wheel]
packages = ["src/aind_ephys_assets"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["scratch"]

[tool.ruff.lint]
extend-select = ["Q", "RUF100", "C90", "I", "F", "E", "W", "D", "UP", "ANN", "PYI"]
extend-ignore = ["ANN401"]  # Skip self/cls type annotations
per-file-ignores = { "tests/*.py" = ["ANN", "D"] }
mccabe = { max-complexity = 14 }
pydocstyle = { convention = "numpy" }

[tool.codespell]
skip = ".git,*.pdf,*.svg,./docs/build,uv.lock,scratch"

[tool.pytest.ini_options]
addopts = "--strict-markers --tb=short --cov=src --cov-report=term-missing --cov-fail-under=0"
testpaths = ["tests"]

[tool.interrogate]
ignore-init-method = true
ignore-magic = true
ignore_module = true
fail-under = 30
exclude = [
  "__init__.py",
  "tests",
  "docs",
  "build",
  "examples",
  "site",
  "scratch",
  ".venv",
]

[tool.commitizen]
version_provider = "pep621"
update_changelog_on_bump = true
tag_format = "v$version"
major_version_zero = true


[tool.mypy]
files = ["src/aind_ephys_assets"]
strict = true
show_error_codes = true
exclude = ["scratch"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["fsspec", "fsspec.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["spikeinterface", "spikeinterface.*", "scipy", "scipy.*"]
ignore_missing_imports = true
